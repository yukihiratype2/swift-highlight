name: Generate release packages

on:
  workflow_call:
    inputs:
      version:
        description: Package version used in artifact filenames
        required: true
        type: string
      release_tag:
        description: Existing tag to publish as a GitHub Release
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Package version used in artifact filenames
        required: true
        default: dev
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out HighlightSwift
        uses: actions/checkout@v4

      - name: Read pinned Highlight.js revision
        id: highlightjs
        run: echo "ref=$(tr -d '[:space:]' < HIGHLIGHTJS_COMMIT)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Highlight.js
        uses: actions/checkout@v4
        with:
          repository: highlightjs/highlight.js
          ref: ${{ steps.highlightjs.outputs.ref }}
          path: .build/highlightjs

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Tools/package-lock.json

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcre2-dev zip

      - name: Generate Highlight.js grammars
        run: Scripts/generate-grammars.sh .build/highlightjs

      - name: Build and test
        run: swift test -c release

      - name: Package generated sources
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${INPUT_VERSION:-$REF_NAME}"
          Scripts/package-release.sh "$version"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HighlightSwift-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --generate-notes
          fi
